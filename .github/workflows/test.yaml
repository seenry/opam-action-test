name: Validate Build

on:
  pull_request:
    branches: [ main ]

jobs:
  automated-testing:
    runs-on: ubuntu-latest
    container:
      image: srhee/caracara:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Build Project
        run: |
          opam env
