name: Test

on:
  pull_request:
    branches: [ main ]

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3
          dune-cache: true
      
      - name: Build Project
        run: |
          pwd
          ls -a
          opam switch create . --packages=coq=8.20.1
          ls -a
